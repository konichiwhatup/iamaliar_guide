<style>
  /* ── 右側 TOC パネル（デスクトップ）── */
  .toc-right {
    display: none;
    position: fixed;
    right: 0;
    top: 3.5rem;
    width: 195px;
    max-height: calc(100vh - 4.5rem);
    overflow-y: auto;
    padding: 0.75rem 0.75rem 1rem 0.75rem;
    background: #161616;
    border-left: 1px solid #2a2a2a;
    font-size: 0.72rem;
    z-index: 9999;
  }
  @media (min-width: 1024px) {
    .toc-right { display: block; }
  }
  .toc-right-title {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #484848;
    margin-bottom: 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #222;
  }
  .toc-right a {
    display: block;
    padding: 0.22rem 0 0.22rem 0.55rem;
    color: #666;
    text-decoration: none;
    border-left: 2px solid transparent;
    line-height: 1.4;
    transition: color 0.12s, border-color 0.12s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toc-right a.h3 {
    padding-left: 1.1rem;
    font-size: 0.67rem;
    color: #4a4a4a;
  }
  .toc-right a:hover { color: #aaa; border-left-color: #444; }
  .toc-right a.active { color: #c8c4bc; border-left-color: #777; }

  /* ── サイドバー検索 固定 ── */
  .side-bar .search {
    position: sticky;
    top: 0;
    z-index: 2;
    background: inherit;
    padding-bottom: 0.25rem;
  }

  /* ── モバイル TOC ボタン ── */
  .toc-mobile-btn {
    display: none;
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 9998;
    background: #222;
    color: #c8c4bc;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    padding: 0.45rem 0.8rem;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  @media (max-width: 1023px) {
    .toc-mobile-btn { display: block; }
  }

  /* ── バックドロップ ── */
  .toc-drawer-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 9997;
  }
  .toc-drawer-backdrop.open { display: block; }

  /* ── ボトムシート ── */
  .toc-drawer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 65vh;
    background: #1a1a1a;
    border-top: 1px solid #2a2a2a;
    border-radius: 12px 12px 0 0;
    overflow-y: auto;
    padding: 1rem 1rem 2rem 1rem;
    z-index: 9998;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  .toc-drawer.open { transform: translateY(0); }
  .toc-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #2a2a2a;
  }
  .toc-drawer-title {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #484848;
  }
  .toc-drawer-close {
    background: none;
    border: none;
    color: #555;
    font-size: 1rem;
    cursor: pointer;
    padding: 0 0.2rem;
    line-height: 1;
  }
  .toc-drawer a {
    display: block;
    padding: 0.5rem 0 0.5rem 0.55rem;
    color: #888;
    text-decoration: none;
    border-left: 2px solid transparent;
    font-size: 0.82rem;
    line-height: 1.4;
  }
  .toc-drawer a.h3 {
    padding-left: 1.2rem;
    font-size: 0.76rem;
    color: #555;
  }
  .toc-drawer a:active { color: #c8c4bc; }
</style>

<script>
(function () {
  if (typeof lunr === 'undefined') return;
  var isCJK = function (s) { return /[　-鿿･-ﾟ]/.test(s); };
  var origTokenizer = lunr.tokenizer;
  var origTrimmer = lunr.trimmer;
  lunr.tokenizer = function (obj, metadata) {
    var tokens = origTokenizer.call(this, obj, metadata);
    var extra = [];
    tokens.forEach(function (t) {
      var s = t.toString();
      if (isCJK(s) && s.length > 1) {
        for (var i = 0; i + 1 < s.length; i++) {
          extra.push(new lunr.Token(s.slice(i, i + 2), {}));
        }
      }
    });
    return tokens.concat(extra);
  };
  lunr.tokenizer.separator = origTokenizer.separator;
  lunr.trimmer = function (token) {
    return isCJK(token.toString()) ? token : origTrimmer(token);
  };
  lunr.Pipeline.registerFunction(lunr.trimmer, 'trimmer');
}());
</script>

<script>
(function () {
  function makeLink(h) {
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/¶|#/g, '').trim();
    if (h.tagName === 'H3') a.classList.add('h3');
    return a;
  }

  function buildToc() {
    if (document.querySelector('.toc-right')) return;

    var content = document.querySelector('#main-content, .main-content, [role="main"], main');
    var headings;
    if (content) {
      headings = Array.prototype.slice.call(content.querySelectorAll('h2, h3'));
    } else {
      headings = Array.prototype.slice.call(document.querySelectorAll('h2, h3'));
      headings = headings.filter(function (h) {
        return !h.closest('.side-bar, nav, [role="navigation"]');
      });
    }

    if (headings.length < 1) return;

    headings.forEach(function (h, i) {
      if (!h.id) h.id = 'toc-' + i;
    });

    /* デスクトップ右側パネル */
    var toc = document.createElement('nav');
    toc.className = 'toc-right';
    toc.setAttribute('aria-label', 'ページ内目次');
    var tocTitle = document.createElement('div');
    tocTitle.className = 'toc-right-title';
    tocTitle.textContent = 'このページの内容';
    toc.appendChild(tocTitle);
    headings.forEach(function (h) { toc.appendChild(makeLink(h)); });
    document.body.appendChild(toc);

    var links = toc.querySelectorAll('a');
    window.addEventListener('scroll', function () {
      var scrollY = window.scrollY + 120;
      var current = headings[0] ? headings[0].id : '';
      headings.forEach(function (h) { if (h.offsetTop <= scrollY) current = h.id; });
      links.forEach(function (a) { a.classList.toggle('active', a.getAttribute('href') === '#' + current); });
    }, { passive: true });

    /* モバイル ボトムシート */
    var backdrop = document.createElement('div');
    backdrop.className = 'toc-drawer-backdrop';

    var drawer = document.createElement('nav');
    drawer.className = 'toc-drawer';
    drawer.setAttribute('aria-label', 'ページ内目次');

    var drawerHeader = document.createElement('div');
    drawerHeader.className = 'toc-drawer-header';
    var drawerTitle = document.createElement('div');
    drawerTitle.className = 'toc-drawer-title';
    drawerTitle.textContent = 'このページの内容';
    var closeBtn = document.createElement('button');
    closeBtn.className = 'toc-drawer-close';
    closeBtn.setAttribute('aria-label', '閉じる');
    closeBtn.textContent = '✕';
    drawerHeader.appendChild(drawerTitle);
    drawerHeader.appendChild(closeBtn);
    drawer.appendChild(drawerHeader);
    headings.forEach(function (h) { drawer.appendChild(makeLink(h)); });

    var mobileBtn = document.createElement('button');
    mobileBtn.className = 'toc-mobile-btn';
    mobileBtn.textContent = '目次';

    document.body.appendChild(backdrop);
    document.body.appendChild(drawer);
    document.body.appendChild(mobileBtn);

    function open() { drawer.classList.add('open'); backdrop.classList.add('open'); }
    function close() { drawer.classList.remove('open'); backdrop.classList.remove('open'); }

    mobileBtn.addEventListener('click', open);
    closeBtn.addEventListener('click', close);
    backdrop.addEventListener('click', close);
    Array.prototype.slice.call(drawer.querySelectorAll('a')).forEach(function (a) {
      a.addEventListener('click', close);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildToc);
  } else {
    buildToc();
  }
}());
</script>
