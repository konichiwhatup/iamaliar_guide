<style>
  /* ── 右側TOC ── */
  .toc-right {
    display: none;
    position: fixed;
    right: 1rem;
    top: 4rem;
    width: 190px;
    font-size: 0.72rem;
    z-index: 9999;
  }
  @media (min-width: 1280px) {
    .toc-right { display: block; }
  }
  .toc-right-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #555;
    margin-bottom: 0.5rem;
  }
  .toc-right a {
    display: block;
    padding: 0.2rem 0 0.2rem 0.6rem;
    color: #777;
    text-decoration: none;
    border-left: 2px solid #2a2a2a;
    margin-bottom: 0.1rem;
    line-height: 1.35;
    transition: color 0.15s, border-color 0.15s;
  }
  .toc-right a.h3 {
    padding-left: 1.2rem;
    font-size: 0.67rem;
    color: #555;
  }
  .toc-right a:hover,
  .toc-right a.active {
    color: #c8c4bc;
    border-left-color: #666;
  }

  /* ── サイドバー内の検索を常に上部に固定 ── */
  .side-bar .search {
    position: sticky;
    top: 0;
    z-index: 2;
    background: inherit;
    padding-bottom: 0.25rem;
  }
</style>

<!-- 日本語(CJK)対応 Lunr トークナイザー: lunr が window に代入された瞬間に差し替える -->
<script>
(function () {
  var _lunr;
  try {
    Object.defineProperty(window, 'lunr', {
      configurable: true, enumerable: true,
      get: function () { return _lunr; },
      set: function (v) {
        _lunr = v;
        if (v && v.Token) {
          var orig = v.tokenizer;
          v.tokenizer = (function (orig) {
            return function (obj, meta) {
              if (obj == null) return [];
              if (Array.isArray(obj)) {
                return obj.reduce(function (m, t) { return m.concat(v.tokenizer(t)); }, []);
              }
              var s = obj.toString().toLowerCase();
              var res = [], buf = '';
              function flushBuf() {
                if (!buf) return;
                res = res.concat(orig(buf, meta));
                buf = '';
              }
              for (var i = 0; i < s.length; i++) {
                var c = s[i], code = c.charCodeAt(0);
                var cjk = (code >= 0x3000 && code <= 0x9fff) || (code >= 0xff00 && code <= 0xffef);
                if (cjk) {
                  flushBuf();
                  res.push(new v.Token(c, {}));
                  if (i + 1 < s.length) {
                    var nc = s[i + 1].charCodeAt(0);
                    if ((nc >= 0x3000 && nc <= 0x9fff) || (nc >= 0xff00 && nc <= 0xffef)) {
                      res.push(new v.Token(c + s[i + 1], {}));
                    }
                  }
                } else {
                  buf += c;
                }
              }
              flushBuf();
              return res;
            };
          })(orig);
          v.tokenizer.separator = orig.separator;
        }
        Object.defineProperty(window, 'lunr', { configurable: true, writable: true, enumerable: true, value: v });
      }
    });
  } catch (e) { /* graceful degradation */ }
})();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var content = document.querySelector('.main-content')
                || document.querySelector('main')
                || document.body;

    var headings = content.querySelectorAll('h2, h3');
    if (headings.length < 2) return;

    // IDがない見出しにのみ生成（既存IDは保持）
    headings.forEach(function (h, i) {
      if (!h.id) h.id = 'toc-' + i;
    });

    var toc = document.createElement('div');
    toc.className = 'toc-right';

    var title = document.createElement('div');
    title.className = 'toc-right-title';
    title.textContent = 'このページの内容';
    toc.appendChild(title);

    headings.forEach(function (h) {
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/[¶#]/g, '').trim();
      if (h.tagName === 'H3') a.classList.add('h3');
      toc.appendChild(a);
    });

    document.body.appendChild(toc);

    var links = toc.querySelectorAll('a');
    window.addEventListener('scroll', function () {
      var current = '';
      headings.forEach(function (h) {
        if (window.scrollY >= h.getBoundingClientRect().top + window.scrollY - 140) {
          current = h.id;
        }
      });
      links.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + current);
      });
    }, { passive: true });
  });
</script>
