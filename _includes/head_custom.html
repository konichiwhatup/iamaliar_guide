<style>
  /* ── 右側 TOC パネル ── */
  .toc-right {
    display: none;
    position: fixed;
    right: 0;
    top: 3.5rem;
    width: 200px;
    max-height: calc(100vh - 4.5rem);
    overflow-y: auto;
    padding: 0.75rem 0.75rem 1rem 0.75rem;
    background: #161616;
    border-left: 1px solid #2a2a2a;
    font-size: 0.72rem;
    z-index: 500;
  }
  @media (min-width: 1024px) {
    .toc-right { display: block; }
  }
  .toc-right-title {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #484848;
    margin-bottom: 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #222;
  }
  .toc-right a {
    display: block;
    padding: 0.22rem 0 0.22rem 0.55rem;
    color: #666;
    text-decoration: none;
    border-left: 2px solid transparent;
    margin-bottom: 0.05rem;
    line-height: 1.4;
    transition: color 0.12s, border-color 0.12s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toc-right a.h3 {
    padding-left: 1.1rem;
    font-size: 0.67rem;
    color: #4a4a4a;
  }
  .toc-right a:hover {
    color: #aaa;
    border-left-color: #444;
  }
  .toc-right a.active {
    color: #c8c4bc;
    border-left-color: #777;
  }

  /* ── サイドバー内の検索を常に上部に固定 ── */
  .side-bar .search {
    position: sticky;
    top: 0;
    z-index: 2;
    background: inherit;
    padding-bottom: 0.25rem;
  }
</style>

<!-- 日本語(CJK)対応 Lunr トークナイザー -->
<script>
(function () {
  var _lunr;
  try {
    Object.defineProperty(window, 'lunr', {
      configurable: true, enumerable: true,
      get: function () { return _lunr; },
      set: function (v) {
        _lunr = v;
        if (v && v.Token) {
          var orig = v.tokenizer;
          v.tokenizer = (function (orig) {
            return function (obj, meta) {
              if (obj == null) return [];
              if (Array.isArray(obj)) {
                return obj.reduce(function (m, t) { return m.concat(v.tokenizer(t)); }, []);
              }
              var s = obj.toString().toLowerCase();
              var res = [], buf = '';
              function flushBuf() {
                if (!buf) return;
                res = res.concat(orig(buf, meta));
                buf = '';
              }
              for (var i = 0; i < s.length; i++) {
                var c = s[i], code = c.charCodeAt(0);
                var cjk = (code >= 0x3000 && code <= 0x9fff) || (code >= 0xff00 && code <= 0xffef);
                if (cjk) {
                  flushBuf();
                  res.push(new v.Token(c, {}));
                  if (i + 1 < s.length) {
                    var nc = s[i + 1].charCodeAt(0);
                    if ((nc >= 0x3000 && nc <= 0x9fff) || (nc >= 0xff00 && nc <= 0xffef)) {
                      res.push(new v.Token(c + s[i + 1], {}));
                    }
                  }
                } else {
                  buf += c;
                }
              }
              flushBuf();
              return res;
            };
          })(orig);
          v.tokenizer.separator = orig.separator;
        }
        Object.defineProperty(window, 'lunr', { configurable: true, writable: true, enumerable: true, value: v });
      }
    });
  } catch (e) { /* graceful degradation */ }
})();
</script>

<!-- 右側TOC生成スクリプト -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  // ページ内の h2 / h3 を取得（スコープを絞らず全体から）
  var headings = Array.prototype.slice.call(document.querySelectorAll('h2, h3'));

  // サイドバー内の見出しは除外（just-the-docs のナビ見出しが混入しないよう）
  headings = headings.filter(function (h) {
    return !h.closest('.side-bar, .nav-list, [role="navigation"]');
  });

  if (headings.length < 1) return;

  // IDがない見出しにのみ生成
  headings.forEach(function (h, i) {
    if (!h.id) h.id = 'toc-' + i;
  });

  var toc = document.createElement('nav');
  toc.className = 'toc-right';
  toc.setAttribute('aria-label', 'ページ内目次');

  var title = document.createElement('div');
  title.className = 'toc-right-title';
  title.textContent = 'このページの内容';
  toc.appendChild(title);

  headings.forEach(function (h) {
    var a = document.createElement('a');
    a.href = '#' + h.id;
    // ¶ や # などのアンカー記号を除去
    a.textContent = h.textContent.replace(/[¶#¶]/g, '').trim();
    if (h.tagName === 'H3') a.classList.add('h3');
    toc.appendChild(a);
  });

  document.body.appendChild(toc);

  // スクロール追従ハイライト
  var links = toc.querySelectorAll('a');
  window.addEventListener('scroll', function () {
    var scrollY = window.scrollY + 120;
    var current = headings[0] ? headings[0].id : '';
    headings.forEach(function (h) {
      if (h.offsetTop <= scrollY) current = h.id;
    });
    links.forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
  }, { passive: true });
});
</script>
