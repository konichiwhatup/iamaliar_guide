<style>
  /* ── 右側 TOC パネル ── */
  .toc-right {
    display: none;
    position: fixed;
    right: 0;
    top: 3.5rem;
    width: 195px;
    max-height: calc(100vh - 4.5rem);
    overflow-y: auto;
    padding: 0.75rem 0.75rem 1rem 0.75rem;
    background: #161616;
    border-left: 1px solid #2a2a2a;
    font-size: 0.72rem;
    z-index: 9999;
  }
  @media (min-width: 1024px) {
    .toc-right { display: block; }
  }
  .toc-right-title {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #484848;
    margin-bottom: 0.6rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #222;
  }
  .toc-right a {
    display: block;
    padding: 0.22rem 0 0.22rem 0.55rem;
    color: #666;
    text-decoration: none;
    border-left: 2px solid transparent;
    line-height: 1.4;
    transition: color 0.12s, border-color 0.12s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toc-right a.h3 {
    padding-left: 1.1rem;
    font-size: 0.67rem;
    color: #4a4a4a;
  }
  .toc-right a:hover {
    color: #aaa;
    border-left-color: #444;
  }
  .toc-right a.active {
    color: #c8c4bc;
    border-left-color: #777;
  }

  /* ── サイドバー内の検索を常に上部に固定 ── */
  .side-bar .search {
    position: sticky;
    top: 0;
    z-index: 2;
    background: inherit;
    padding-bottom: 0.25rem;
  }
</style>

<!-- 右側TOC生成スクリプト -->
<script>
(function () {
  function buildToc() {
    if (document.querySelector('.toc-right')) return;

    var content = document.querySelector('#main-content, .main-content, [role="main"], main');
    var headings;
    if (content) {
      headings = Array.prototype.slice.call(content.querySelectorAll('h2, h3'));
    } else {
      headings = Array.prototype.slice.call(document.querySelectorAll('h2, h3'));
      headings = headings.filter(function (h) {
        return !h.closest('.side-bar, nav, [role="navigation"]');
      });
    }

    if (headings.length < 1) return;

    headings.forEach(function (h, i) {
      if (!h.id) h.id = 'toc-' + i;
    });

    var toc = document.createElement('nav');
    toc.className = 'toc-right';
    toc.setAttribute('aria-label', 'ページ内目次');

    var title = document.createElement('div');
    title.className = 'toc-right-title';
    title.textContent = 'このページの内容';
    toc.appendChild(title);

    headings.forEach(function (h) {
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/¶|#/g, '').trim();
      if (h.tagName === 'H3') a.classList.add('h3');
      toc.appendChild(a);
    });

    document.body.appendChild(toc);

    var links = toc.querySelectorAll('a');
    window.addEventListener('scroll', function () {
      var scrollY = window.scrollY + 120;
      var current = headings[0] ? headings[0].id : '';
      headings.forEach(function (h) {
        if (h.offsetTop <= scrollY) current = h.id;
      });
      links.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + current);
      });
    }, { passive: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildToc);
  } else {
    buildToc();
  }
}());
</script>
